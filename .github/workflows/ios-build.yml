name: iOS simulator build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project appios.xcodeproj \
            -scheme appios \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/appios.app Move-iOS-Simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Move-iOS-Simulator
          path: Move-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
